openapi: 3.1.0
info:
  title: Handelsplattform Energiegemeinschaften
  version: 0.2.0
  description: |
    Gemeinsamer Datenvertrag der Handelsplattformen (Entwurf 0.2).

    Version 0.2 setzt die Rückmeldung vom 16.11.2026 um. Die Struktur aus 0.1 bleibt erhalten.
    Alles, was mit **(Vorschlag)** markiert ist, schlagen wir zur Abstimmung vor. Es ist noch nicht gemeinsam beschlossen.

    ## Allgemeine Konventionen
    - Format: JSON, Fehler mit `code` und `message`
    - Alle IDs sind UUIDs (RFC 9562)
    - Eigene Kennung einer Ressource heißt immer `id`, Verweise heißen `energyCommunityId` bzw. `positionId`
    - `deliveryDate`: `YYYY-MM-DD` (Europe/Vienna)
    - Zeitstempel: RFC 3339 (`date-time`), bevorzugt UTC
    - Mengen in kWh, Preise in EUR/kWh, Beträge in EUR (2 Nachkommastellen)
    - Anmeldung: Web-UI mit `POST /auth/login` (E-Mail und Passwort), danach `Authorization: Bearer <token>`; `POST /auth/logout` macht das Token sofort ungültig. Systeme nutzen den API-Key im Header `X-API-Key`. Alle Endpoints außer Registrierung, Login und `/health/*` brauchen eines von beiden
    - Rollen: `ADMIN` und `ENERGY_COMMUNITY`. Die Rolle ergibt sich aus den Zugangsdaten, `GET /me` zeigt sie an. Jeder Endpoint nennt die erlaubten Rollen in `x-roles`
    - Registrierung: EGs registrieren sich selbst mit E-Mail (`POST /energy-communities`, Status `PENDING`). Der Admin schaltet sie mit `PUT /energy-communities/{id}/status` frei (`ACTIVE`) und vergibt API-Key und Passwort (`POST /energy-communities/{id}/credentials`), die er der EG manuell übergibt
    - Der Admin-Account (E-Mail, Passwort, API-Key) wird vom Betreiber konfiguriert (z. B. Kubernetes-Secret)
    - Eine EG sieht und ändert nur ihre eigenen Daten (Profil, Positionen, Zuteilungen, Handelsabschlüsse), fremde Daten: `403` (Details unter „Mandantentrennung“)
    - Nur `ACTIVE`-EGs können sich anmelden und Positionen einreichen, ändern oder stornieren
    - Nur der Admin darf EGs auflisten, löschen, den Status ändern, Zugangsdaten vergeben, Märkte schließen und das Tagesergebnis abrufen
    - Pro EG, Liefertag und Lieferintervall genau eine Position (`OFFER` oder `DEMAND`). Im Tagesmarkt ist das eine Position pro Liefertag
    - Ändern und Stornieren nur bis Marktschluss (Markt `OPEN` und `closesAt` noch nicht erreicht)
    - Reserve nur bei Unterdeckung: `max(D - S, 0)`, wobei `S` nur die **handelbaren** Angebote zählt (siehe „Handels- und Preislogik“)

    ## Zeitliche Auflösung (Vorschlag, Entscheidung offen)
    Jeder Markt hat eine feste `resolution`, die der Betreiber pro Liefertag festlegt:
    - `DAY` (Tagesmarkt): ein Lieferintervall pro Liefertag. Positionen haben kein `intervalStart` (in Antworten `null`). **Für das Labor schlagen wir `DAY` als Standard vor.**
    - `QUARTER_HOUR` (15-Minuten-Markt): 96 Intervalle pro Liefertag (92 bzw. 100 an den Tagen der Zeitumstellung). Jede Position braucht `intervalStart`.

    Regeln für `intervalStart`:
    - UTC-Zeitstempel auf einer vollen Viertelstunde (Minute 00, 15, 30 oder 45, Sekunden 0), z. B. `2026-11-20T11:15:00Z`
    - muss im Liefertag nach Europe/Vienna liegen; das Intervall dauert 15 Minuten
    - fehlt bei `QUARTER_HOUR`, ist bei `DAY` angegeben oder liegt außerhalb des Liefertags: `400 INVALID_INTERVAL`

    Der Markt wird weiterhin einmal pro Liefertag geschlossen. Matching, Teilzuteilung und Reserve werden aber für jedes Intervall einzeln berechnet.
    Zuteilungen und Handelsabschlüsse enthalten `intervalStart`, das Tagesergebnis enthält zusätzlich `intervals`.

    ## Handels- und Preislogik (Vorschlag)
    Die Plattform ist Gegenpartei aller Geschäfte. Sie kauft von anbietenden EGs (`PLATFORM_BUYS`) und verkauft an nachfragende EGs (`PLATFORM_SELLS`).
    Fehlende Mengen kauft sie als Reserve beim Kraftwerk zu.

    **Preise.** Der Betreiber legt pro Markt drei Preise fest. Sie stehen ab Marktöffnung in `Market.prices` und ändern sich bis zum Settlement nicht:
    - `buyPriceEurPerKwh`: den zahlt die Plattform den anbietenden EGs
    - `sellPriceEurPerKwh`: den zahlen nachfragende EGs, auch für Mengen aus der Reserve
    - `reservePriceEurPerKwh`: den zahlt die Plattform dem Kraftwerk für die Reserve

    **Matching beim Marktschluss** (bei `QUARTER_HOUR` je Intervall):
    1. Berücksichtigt werden nur Positionen mit Status `CLOSED`.
    2. Ein Angebot ist **handelbar**, wenn es keine `priceExpectationEurPerKwh` hat oder diese höchstens `buyPriceEurPerKwh` beträgt. Angebote mit höherer Preisvorstellung werden nicht gehandelt (`allocatedKwh: 0`, `reason: PRICE_NOT_MET`).
    3. `D` = Summe aller Bedarfe, `S` = Summe der handelbaren Angebote.
    4. Ist `S <= D`, kauft die Plattform alle handelbaren Angebote vollständig. Ist `S > D`, kauft sie nur `D`. Jedes handelbare Angebot erhält dann denselben Anteil `D / S` (Teilzuteilung pro rata, `reason: PARTIALLY_ALLOCATED`). Ist `D = 0`, wird nichts gekauft (`reason: NOT_NEEDED`).
    5. Reserve: `requiredKwh = max(D - S, 0)`. Angebote, die wegen ihrer Preisvorstellung nicht gehandelt werden, zählen also nicht zu `S` und erhöhen den Reservebedarf.
    6. Bedarfe werden aus den gekauften Angeboten und der Reserve gedeckt. Liefert das Kraftwerk weniger als `requiredKwh` (`PARTIAL` oder `UNAVAILABLE`), erhält jeder Bedarf denselben Anteil der verfügbaren Menge (`reason: RESERVE_SHORTAGE`).

    Beispiel Teilzuteilung: handelbare Angebote 100 kWh und 60 kWh, Bedarf 120 kWh. Anteil 120 / 160 = 0,75, Zuteilung 75 kWh und 45 kWh, keine Reserve.

    **Runden.** Zugeteilte Mengen werden auf 0,001 kWh abgerundet. Den Rest aus dem Abrunden verteilt die Plattform in Schritten von 0,001 kWh nach `createdAt` der Positionen (bei Gleichstand nach `id`).
    Beträge sind Menge × Preis, pro Handelsabschluss kaufmännisch auf 0,01 EUR gerundet. Für Geldbeträge Dezimalarithmetik verwenden, keine Gleitkommazahlen.

    **Handelsabschlüsse.** Jeder Trade verweist mit `positionId` auf die Position, aus der er entstanden ist:
    - pro gekauftem Angebot ein Trade `PLATFORM_BUYS` zu `buyPriceEurPerKwh`
    - pro gedecktem Bedarf ein Trade `PLATFORM_SELLS` mit `fromReserve: false` für den Anteil aus Angeboten. Falls Reserve verwendet wurde, kommt ein zweiter Trade mit `fromReserve: true` dazu. Beide kosten `sellPriceEurPerKwh`. Der Reserveanteil wird pro rata auf die Bedarfe verteilt
    - Mengen von 0 kWh erzeugen keinen Trade, nur eine Zuteilung

    **Tagesergebnis.** `purchaseCostEur` ist die Summe der `PLATFORM_BUYS`, `salesRevenueEur` die Summe der `PLATFORM_SELLS`, `reserve.costEur = dispatchedKwh × reservePriceEurPerKwh`.
    `marginEur = salesRevenueEur - purchaseCostEur - reserve.costEur` (kann negativ sein).

    ## Mandantentrennung und Berechtigungen
    Alle Berechtigungen prüft der Server. Ausgeblendete Buttons in der UI ersetzen keine Prüfung.
    - Welche EG anfragt, ergibt sich nur aus API-Key bzw. Token, nie aus Pfad, Query oder Body.
    - `POST /positions`: Für eine EG ist `energyCommunityId` optional. Fehlt sie, setzt der Server die eigene ID ein. Ist eine fremde ID angegeben: `403 FORBIDDEN`, es wird nichts gespeichert. Der Admin reicht keine Positionen ein (`403 FORBIDDEN`).
    - Listen (`GET /positions`, `/allocations`, `/trades`): Für eine EG filtert der Server immer auf die eigene EG. Ein Filter `energyCommunityId` mit fremder ID ergibt `403 FORBIDDEN` (keine leere Liste). Der Admin sieht alles und darf frei filtern.
    - Einzelressourcen (`/positions/{id}`, `/energy-communities/{id}`): Der Server lädt die Ressource und prüft die Eigentümerschaft, bevor er sie zurückgibt oder ändert. Fremde Ressource: `403 FORBIDDEN`.
    - Zugangsdaten einer EG, die nicht `ACTIVE` ist, werden mit `403 ENERGY_COMMUNITY_NOT_ACTIVE` abgelehnt.
    - Reihenfolge der Prüfungen: `401` (angemeldet?) → `403` (Rolle, EG aktiv?) → `400` (Format) → `404` (existiert?) → `403` (eigene Ressource?) → `409`/`422` (Zustand).
    - Passwörter und API-Keys werden nur gehasht gespeichert. Im Klartext erscheinen sie nur einmal in der Antwort von `POST /energy-communities/{id}/credentials`, nie in Logs. Außerhalb von `localhost` nur über HTTPS. (Vorschlag)

    ## Rollen und Statusänderungen
    - `PUT /energy-communities/{id}` ändert nur das Profil (`name`, `description`). `status` ist dort nicht erlaubt (`400 VALIDATION_FAILED`).
    - Den Status ändert nur der Admin, und zwar über `PUT /energy-communities/{id}/status`.
    - Erlaubte Übergänge (Vorschlag): `PENDING → ACTIVE`, `PENDING → SUSPENDED`, `ACTIVE → SUSPENDED`, `SUSPENDED → ACTIVE`. Zurück zu `PENDING` geht nicht. Andere Übergänge: `409 INVALID_STATUS_TRANSITION`. Wird derselbe Status erneut gesetzt, antwortet der Server mit `200` ohne Änderung.
    - Positionen einer EG, die beim Marktschluss nicht `ACTIVE` ist, werden `REJECTED` (`rejectionReason: ENERGY_COMMUNITY_NOT_ACTIVE`). (Vorschlag)

    ## Statusübergänge bei Marktschluss und Settlement (Vorschlag)
    Markt:

    | Von | Nach | Auslöser |
    |---|---|---|
    | – | `OPEN` | Betreiber legt den Markt für einen Liefertag an |
    | `OPEN` | `CLOSED` | Admin ruft `POST /markets/{deliveryDate}/close` auf. Alle `OPEN`-Positionen werden `CLOSED` bzw. `REJECTED` |
    | `CLOSED` | `SETTLED` | Settlement erfolgreich: Zuteilungen, Trades und Ergebnis werden in einem Schritt (atomar) gespeichert |
    | `CLOSED` | `FAILED` | Settlement fehlgeschlagen: Es wird nichts gespeichert, `failureReason` nennt den Grund |
    | `FAILED` | `CLOSED` | Admin ruft `close` erneut auf (neuer Versuch) |

    - Ab `closesAt` lehnt der Server neue, geänderte und stornierte Positionen mit `409 MARKET_CLOSED` ab, auch wenn der Admin den Markt noch nicht geschlossen hat.
    - `close` ist idempotent: Bei `CLOSED` oder `SETTLED` wird nichts neu berechnet.
    - `close` antwortet mit `200`, wenn das Settlement fertig ist (`SETTLED`), und mit `202`, wenn es noch läuft (`CLOSED`). Dann `GET /markets/{deliveryDate}` abfragen, bis der Status `SETTLED` oder `FAILED` ist.
    - Ergebnisse (`/result`, `/allocations`, `/trades`) gibt es nur bei `SETTLED`, sonst `409 MARKET_NOT_SETTLED`. `SETTLED` ist endgültig.

    Position:

    | Von | Nach | Auslöser |
    |---|---|---|
    | – | `OPEN` | EG reicht die Position ein |
    | `OPEN` | `CANCELLED` | EG storniert vor Marktschluss |
    | `OPEN` | `CLOSED` | Marktschluss, EG ist `ACTIVE` |
    | `OPEN` | `REJECTED` | Marktschluss, EG ist nicht `ACTIVE` |
    | `CLOSED` | `PROCESSED` | Settlement erfolgreich; es gibt eine Zuteilung, eventuell mit 0 kWh |

    `CANCELLED`, `REJECTED` und `PROCESSED` sind Endzustände. Bei `FAILED` bleiben die Positionen `CLOSED`.

    ## Beispielablauf
    Die Beispiele `flow…` an den Endpoints bilden einen vollständigen Ablauf mit durchgehenden IDs (auch als JSON-Dateien im Ordner `beispiele/`).
    Liefertag 2026-11-20, Tagesmarkt, Preise: Ankauf 0,10, Verkauf 0,14, Reserve 0,20 EUR/kWh.
    1. EG Sonnenfeld registriert sich (`PENDING`), der Admin aktiviert sie und vergibt Zugangsdaten, die EG meldet sich an
    2. EG Sonnenfeld bietet 120 kWh mit Preisvorstellung 0,09 an und ändert auf 100 kWh mit Preisvorstellung 0,08
    3. EG Windpark Nord bietet 50 kWh mit Preisvorstellung 0,12 an (zu teuer, wird nicht gehandelt)
    4. EG Altstadt meldet einen Bedarf von 130 kWh an
    5. Der Admin schließt den Markt. `S` = 100, `D` = 130, Reserve 30 kWh
    6. Zuteilungen, drei Handelsabschlüsse und Tagesergebnis: Einkauf 10,00 EUR, Verkauf 18,20 EUR, Reserve 6,00 EUR, Marge 2,20 EUR

    ## Validation
    - IDs: valid UUID in the format `xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx`; the `id` of an energy community is generated by the platform
    - `email`: valid email address, at most 254 characters, unique per energy community
    - `password` (login): required, at most 128 characters; generated passwords have at least 8 characters
    - `name`: 1-120 characters, not only whitespace
    - `description` (optional): 1-500 characters
    - `status`: `PENDING`, `ACTIVE` or `SUSPENDED`; only the admin may set it, and only via `PUT /energy-communities/{id}/status` (new energy communities start as `PENDING`)
    - `deliveryDate`: format `YYYY-MM-DD`, not in the past
    - `intervalStart`: required for `QUARTER_HOUR` markets, not allowed for `DAY` markets; UTC on a full quarter hour within the delivery day
    - `quantityKwh`: greater than 0, at most 1,000,000, at most 3 decimal places
    - Prices: 0 to 100 EUR/kWh, at most 5 decimal places
    - Decimal places are checked by the server and reported as `INVALID_QUANTITY` or `INVALID_PRICE` (schema validators handle decimals unreliably)
    - `priceExpectationEurPerKwh` is optional and only allowed for `OFFER`; it is the minimum price the energy community accepts
    - Missing required fields or unknown fields: `400 VALIDATION_FAILED` with `details` per field

    ## Error codes
    Error format: `{ "code": "...", "message": "...", "details": [{ "field": "/quantityKwh", "code": "...", "message": "..." }] }`

    | HTTP | Code | Meaning |
    |---|---|---|
    | 400 | `VALIDATION_FAILED` | At least one field is invalid. |
    | 400 | `INVALID_ID` | The ID is not a valid UUID. |
    | 400 | `INVALID_DELIVERY_DATE` | deliveryDate must be in the format YYYY-MM-DD. |
    | 400 | `INVALID_INTERVAL` | intervalStart is missing, not allowed or not a quarter hour of the delivery day. |
    | 400 | `INVALID_POSITION_TYPE` | type must be OFFER or DEMAND. |
    | 400 | `INVALID_QUANTITY` | quantityKwh must be greater than 0 (max. 3 decimal places). |
    | 400 | `INVALID_PRICE` | The price must be between 0 and 100 EUR/kWh (max. 5 decimal places). |
    | 401 | `UNAUTHORIZED` | API key or token is missing, invalid or expired. |
    | 401 | `INVALID_CREDENTIALS` | Email or password is wrong. |
    | 403 | `FORBIDDEN` | You are not allowed to access this resource or perform this action. |
    | 403 | `ENERGY_COMMUNITY_NOT_ACTIVE` | The energy community is not active (pending approval or suspended). |
    | 404 | `ENERGY_COMMUNITY_NOT_FOUND` | The energy community does not exist. |
    | 404 | `POSITION_NOT_FOUND` | The position does not exist. |
    | 404 | `MARKET_NOT_FOUND` | No market exists for the delivery date. |
    | 409 | `EMAIL_ALREADY_REGISTERED` | An energy community with this email is already registered. |
    | 409 | `ENERGY_COMMUNITY_IN_USE` | The energy community cannot be deleted because it has positions or trades. |
    | 409 | `INVALID_STATUS_TRANSITION` | This status change is not allowed. |
    | 409 | `POSITION_ALREADY_EXISTS` | A position already exists for this energy community, delivery date and interval. |
    | 409 | `POSITION_NOT_MODIFIABLE` | The position is cancelled or already processed and can no longer be changed. |
    | 409 | `MARKET_CLOSED` | The market is already closed. |
    | 409 | `MARKET_NOT_SETTLED` | The market result is not available yet. |
    | 422 | `DELIVERY_DATE_IN_PAST` | The delivery date is in the past. |
    | 500 | `INTERNAL_ERROR` | Internal error. |
servers:
- url: http://localhost:8080
tags:
- name: Authentication
  description: Rolle und Identität zum API-Key
- name: Energy Communities
  description: Verwaltung der Energiegemeinschaften
- name: Positions
  description: Tagesangebot bzw. Tagesbedarf
- name: Markets
  description: Tagesmarkt je Liefertag
- name: Results
  description: Zuteilungen, Handelsabschlüsse, Tagesergebnis
- name: Operations
  description: Kubernetes-Probes
security:
- ApiKeyAuth: []
- BearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Mit E-Mail und Passwort anmelden
      description: 'Rollen: Ohne Anmeldung. EGs, die nicht ACTIVE sind, erhalten 403 ENERGY_COMMUNITY_NOT_ACTIVE.'
      operationId: login
      x-roles: &id003 []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              flow04_login:
                summary: 'Ablauf 4: EG Sonnenfeld meldet sich an'
                value:
                  email: kontakt@eg-sonnenfeld.example
                  password: <Passwort aus Schritt 3>
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                flow04_login:
                  summary: 'Ablauf 4: Token'
                  value:
                    token: <Token>
                    tokenType: Bearer
                    expiresIn: 3600
                    role: ENERGY_COMMUNITY
                    energyCommunity: &id002
                      id: 3f6c1c8e-5b1f-4c37-a8b1-1c6d9b9d2a10
                      email: kontakt@eg-sonnenfeld.example
                      name: EG Sonnenfeld
                      description: Photovoltaik-Gemeinschaft
                      status: ACTIVE
                      createdAt: '2026-11-17T08:00:00Z'
                      updatedAt: '2026-11-17T09:30:00Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_FAILED:
                  $ref: '#/components/examples/VALIDATION_FAILED'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_CREDENTIALS:
                  $ref: '#/components/examples/INVALID_CREDENTIALS'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ENERGY_COMMUNITY_NOT_ACTIVE:
                  $ref: '#/components/examples/ENERGY_COMMUNITY_NOT_ACTIVE'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INTERNAL_ERROR:
                  $ref: '#/components/examples/INTERNAL_ERROR'
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Abmelden
      description: 'Rollen: ADMIN (alle Daten) und ENERGY_COMMUNITY (nur eigene Daten).'
      operationId: logout
      x-roles: &id001
      - ADMIN
      - ENERGY_COMMUNITY
      security:
      - BearerAuth: []
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHORIZED:
                  $ref: '#/components/examples/UNAUTHORIZED'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INTERNAL_ERROR:
                  $ref: '#/components/examples/INTERNAL_ERROR'
  /me:
    get:
      tags:
      - Authentication
      summary: Eigene Rolle und EG abrufen
      description: 'Rollen: ADMIN (alle Daten) und ENERGY_COMMUNITY (nur eigene Daten).'
      operationId: getMe
      x-roles: *id001
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                energyCommunity:
                  summary: Als EG angemeldet
                  value:
                    role: ENERGY_COMMUNITY
                    energyCommunity: *id002
                admin:
                  summary: Als Admin angemeldet
                  value:
                    role: ADMIN
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHORIZED:
                  $ref: '#/components/examples/UNAUTHORIZED'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INTERNAL_ERROR:
                  $ref: '#/components/examples/INTERNAL_ERROR'
  /energy-communities:
    post:
      tags:
      - Energy Communities
      summary: EG registrieren
      description: 'Rollen: Ohne Anmeldung. Neue EGs starten immer mit Status PENDING.'
      operationId: registerEnergyCommunity
      x-roles: *id003
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnergyCommunityRegistration'
            examples:
              flow01_register:
                summary: 'Ablauf 1: EG Sonnenfeld registriert sich'
                value:
                  email: kontakt@eg-sonnenfeld.example
                  name: EG Sonnenfeld
                  description: Photovoltaik-Gemeinschaft
      responses:
        '201':
          description: Created (status PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnergyCommunity'
              examples:
                flow01_register:
                  summary: 'Ablauf 1: Status PENDING'
                  value:
                    id: 3f6c1c8e-5b1f-4c37-a8b1-1c6d9b9d2a10
                    email: kontakt@eg-sonnenfeld.example
                    name: EG Sonnenfeld
                    description: Photovoltaik-Gemeinschaft
                    status: PENDING
                    createdAt: '2026-11-17T08:00:00Z'
                    updatedAt: '2026-11-17T08:00:00Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_FAILED:
                  $ref: '#/components/examples/VALIDATION_FAILED'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                EMAIL_ALREADY_REGISTERED:
                  $ref: '#/components/examples/EMAIL_ALREADY_REGISTERED'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INTERNAL_ERROR:
                  $ref: '#/components/examples/INTERNAL_ERROR'
    get:
      tags:
      - Energy Communities
      summary: EGs auflisten
      description: 'Rollen: Nur ADMIN.'
      operationId: listEnergyCommunities
      x-roles: &id004
      - ADMIN
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/EnergyCommunityStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnergyCommunity'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_FAILED:
                  $ref: '#/components/examples/VALIDATION_FAILED'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHORIZED:
                  $ref: '#/components/examples/UNAUTHORIZED'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                FORBIDDEN:
                  $ref: '#/components/examples/FORBIDDEN'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INTERNAL_ERROR:
                  $ref: '#/components/examples/INTERNAL_ERROR'
  /energy-communities/{id}:
    parameters:
    - $ref: '#/components/parameters/EnergyCommunityId'
    get:
      tags:
