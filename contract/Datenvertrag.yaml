            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                MARKET_NOT_SETTLED:
                  $ref: '#/components/examples/MARKET_NOT_SETTLED'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INTERNAL_ERROR:
                  $ref: '#/components/examples/INTERNAL_ERROR'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
  /health/live:
    get:
      tags:
      - Operations
      summary: Liveness-Probe
      description: 'Rollen: Ohne Anmeldung.'
      operationId: livenessProbe
      x-roles: *id003
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                up:
                  summary: Bereit
                  value:
                    status: UP
                    checks:
                      database: UP
  /health/ready:
    get:
      tags:
      - Operations
      summary: Readiness-Probe
      description: 'Rollen: Ohne Anmeldung.'
      operationId: readinessProbe
      x-roles: *id003
      security: []
      responses:
        '200':
          description: Ready to receive traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                up:
                  summary: Bereit
                  value:
                    status: UP
                    checks:
                      database: UP
        '503':
          description: Not ready (e.g. database unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'API-Key für den Systemzugriff. Der Admin vergibt ihn manuell mit POST /energy-communities/{id}/credentials
        und übergibt ihn der EG. Fehlt der Key oder ist er ungültig: 401.'
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Token aus POST /auth/login (E-Mail und Passwort), gedacht für die Web-UI. Header: Authorization: Bearer
        <token>. Das Token läuft nach expiresIn Sekunden ab: 401.'
  parameters:
    EnergyCommunityId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EnergyCommunityId'
    PositionId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PositionId'
    DeliveryDate:
      name: deliveryDate
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DeliveryDate'
  schemas:
    EnergyCommunityId:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      examples:
      - 3f6c1c8e-5b1f-4c37-a8b1-1c6d9b9d2a10
    PositionId:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      examples:
      - 6b1a8f3e-2d94-4a77-9c1e-0f5e8a7b1234
    DeliveryDate:
      type: string
      format: date
      pattern: ^\d{4}-\d{2}-\d{2}$
      examples:
      - '2026-11-20'
    Timestamp:
      type: string
      format: date-time
    QuantityKwh:
      type: number
      exclusiveMinimum: 0
      maximum: 1000000
      examples:
      - 120.5
      x-maxDecimals: 3
    QuantityKwhNonNegative:
      type: number
      minimum: 0
      maximum: 1000000
      x-maxDecimals: 3
    PriceEurPerKwh:
      type: number
      minimum: 0
      maximum: 100
      examples:
      - 0.1
      x-maxDecimals: 5
    AmountEur:
      type: number
      x-maxDecimals: 2
    PositionType:
      type: string
      enum:
      - OFFER
      - DEMAND
    PositionStatus:
      type: string
      enum:
      - OPEN
      - CANCELLED
      - CLOSED
      - PROCESSED
      - REJECTED
    MarketStatus:
      type: string
      enum:
      - OPEN
      - CLOSED
      - SETTLED
      - FAILED
    TradeDirection:
      type: string
      enum:
      - PLATFORM_BUYS
      - PLATFORM_SELLS
    ReserveStatus:
      type: string
      enum:
      - NOT_NEEDED
      - COVERED
      - PARTIAL
      - UNAVAILABLE
    ErrorCode:
      type: string
      enum:
      - VALIDATION_FAILED
      - INVALID_ID
      - INVALID_DELIVERY_DATE
      - INVALID_INTERVAL
      - INVALID_POSITION_TYPE
      - INVALID_QUANTITY
      - INVALID_PRICE
      - UNAUTHORIZED
      - INVALID_CREDENTIALS
      - FORBIDDEN
      - ENERGY_COMMUNITY_NOT_ACTIVE
      - ENERGY_COMMUNITY_NOT_FOUND
      - POSITION_NOT_FOUND
      - MARKET_NOT_FOUND
      - EMAIL_ALREADY_REGISTERED
      - ENERGY_COMMUNITY_IN_USE
      - INVALID_STATUS_TRANSITION
      - POSITION_ALREADY_EXISTS
      - POSITION_NOT_MODIFIABLE
      - MARKET_CLOSED
      - MARKET_NOT_SETTLED
      - DELIVERY_DATE_IN_PAST
      - INTERNAL_ERROR
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
                examples:
                - /quantityKwh
              code:
                $ref: '#/components/schemas/ErrorCode'
              message:
                type: string
    EnergyCommunity:
      type: object
      required:
      - id
      - email
      - name
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/EnergyCommunityId'
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/EnergyCommunityStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    PositionRequest:
      type: object
      required:
      - deliveryDate
      - type
      - quantityKwh
      additionalProperties: false
      properties:
        energyCommunityId:
          $ref: '#/components/schemas/EnergyCommunityId'
          description: Optional. Der Server setzt die ID der angemeldeten EG ein. Eine fremde ID ergibt 403 FORBIDDEN.
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        intervalStart:
          $ref: '#/components/schemas/IntervalStart'
          description: Nur bei QUARTER_HOUR-Märkten, dort Pflicht. Bei DAY-Märkten nicht erlaubt.
        type:
          $ref: '#/components/schemas/PositionType'
        quantityKwh:
          $ref: '#/components/schemas/QuantityKwh'
        priceExpectationEurPerKwh:
          $ref: '#/components/schemas/PriceEurPerKwh'
          description: 'Nur bei OFFER: Mindestpreis, zu dem die EG verkauft. Liegt er über buyPriceEurPerKwh, wird das Angebot
            nicht gehandelt.'
      if:
        properties:
          type:
            const: DEMAND
        required:
        - type
      then:
        not:
          required:
          - priceExpectationEurPerKwh
    PositionUpdate:
      type: object
      required:
      - quantityKwh
      additionalProperties: false
      properties:
        quantityKwh:
          $ref: '#/components/schemas/QuantityKwh'
        priceExpectationEurPerKwh:
          $ref: '#/components/schemas/PriceEurPerKwh'
    Position:
      type: object
      required:
      - id
      - energyCommunityId
      - deliveryDate
      - intervalStart
      - type
      - quantityKwh
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/PositionId'
        energyCommunityId:
          $ref: '#/components/schemas/EnergyCommunityId'
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        intervalStart:
          $ref: '#/components/schemas/IntervalStartOrNull'
        type:
          $ref: '#/components/schemas/PositionType'
        quantityKwh:
          $ref: '#/components/schemas/QuantityKwh'
        priceExpectationEurPerKwh:
          $ref: '#/components/schemas/PriceEurPerKwh'
        status:
          $ref: '#/components/schemas/PositionStatus'
        rejectionReason:
          type:
          - string
          - 'null'
          description: Nur bei REJECTED gesetzt, z. B. ENERGY_COMMUNITY_NOT_ACTIVE.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    Market:
      type: object
      required:
      - deliveryDate
      - resolution
      - status
      - prices
      - closesAt
      properties:
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        resolution:
          $ref: '#/components/schemas/MarketResolution'
        status:
          $ref: '#/components/schemas/MarketStatus'
        prices:
          $ref: '#/components/schemas/Prices'
          description: Ab Marktöffnung bekannt und bis zum Settlement unverändert (Vorschlag).
        closesAt:
          $ref: '#/components/schemas/Timestamp'
          description: Ab diesem Zeitpunkt werden keine Positionen mehr angenommen, geändert oder storniert.
        closedAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        settledAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        failureReason:
          type:
          - string
          - 'null'
          description: Nur bei FAILED gesetzt.
    Allocation:
      type: object
      required:
      - deliveryDate
      - intervalStart
      - positionId
      - energyCommunityId
      - type
      - requestedKwh
      - allocatedKwh
      - reason
      properties:
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        intervalStart:
          $ref: '#/components/schemas/IntervalStartOrNull'
        positionId:
          $ref: '#/components/schemas/PositionId'
        energyCommunityId:
          $ref: '#/components/schemas/EnergyCommunityId'
        type:
          $ref: '#/components/schemas/PositionType'
        requestedKwh:
          $ref: '#/components/schemas/QuantityKwh'
        allocatedKwh:
          $ref: '#/components/schemas/QuantityKwhNonNegative'
        reason:
          $ref: '#/components/schemas/AllocationReason'
    Trade:
      type: object
      required:
      - id
      - deliveryDate
      - intervalStart
      - positionId
      - energyCommunityId
      - direction
      - fromReserve
      - quantityKwh
      - priceEurPerKwh
      - amountEur
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/TradeId'
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        intervalStart:
          $ref: '#/components/schemas/IntervalStartOrNull'
        positionId:
          $ref: '#/components/schemas/PositionId'
          description: Position, aus der dieser Handelsabschluss entstanden ist.
        energyCommunityId:
          $ref: '#/components/schemas/EnergyCommunityId'
        direction:
          $ref: '#/components/schemas/TradeDirection'
        fromReserve:
          type: boolean
          description: true, wenn die Menge eines Bedarfs aus der Reserve gedeckt wurde (nur bei PLATFORM_SELLS).
        quantityKwh:
          $ref: '#/components/schemas/QuantityKwh'
        priceEurPerKwh:
          $ref: '#/components/schemas/PriceEurPerKwh'
        amountEur:
          $ref: '#/components/schemas/AmountEur'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Prices:
      type: object
      required:
      - deliveryDate
      - buyPriceEurPerKwh
      - sellPriceEurPerKwh
      properties:
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        buyPriceEurPerKwh:
          oneOf:
          - $ref: '#/components/schemas/PriceEurPerKwh'
          - type: 'null'
        sellPriceEurPerKwh:
          oneOf:
          - $ref: '#/components/schemas/PriceEurPerKwh'
          - type: 'null'
        reservePriceEurPerKwh:
          oneOf:
          - $ref: '#/components/schemas/PriceEurPerKwh'
          - type: 'null'
    Reserve:
      type: object
      required:
      - deliveryDate
      - status
      - requiredKwh
      - dispatchedKwh
      - costEur
      properties:
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        status:
          $ref: '#/components/schemas/ReserveStatus'
        requiredKwh:
          $ref: '#/components/schemas/QuantityKwhNonNegative'
          description: max(D - S, 0), S = Summe der handelbaren Angebote.
        dispatchedKwh:
          $ref: '#/components/schemas/QuantityKwhNonNegative'
        priceEurPerKwh:
          oneOf:
          - $ref: '#/components/schemas/PriceEurPerKwh'
          - type: 'null'
        costEur:
          $ref: '#/components/schemas/AmountEur'
    MarketResult:
      type: object
      required:
      - deliveryDate
      - resolution
      - status
      - settledAt
      - totalOfferedKwh
      - tradableOfferedKwh
      - totalDemandKwh
      - totalPurchasedKwh
      - totalSoldKwh
      - reserve
      - prices
      - purchaseCostEur
      - salesRevenueEur
      - marginEur
      properties:
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        resolution:
          $ref: '#/components/schemas/MarketResolution'
        status:
          $ref: '#/components/schemas/MarketStatus'
        settledAt:
          $ref: '#/components/schemas/Timestamp'
        totalOfferedKwh:
          $ref: '#/components/schemas/QuantityKwhNonNegative'
        tradableOfferedKwh:
          $ref: '#/components/schemas/QuantityKwhNonNegative'
          description: Summe der Angebote, deren Preisvorstellung erfüllt ist (S).
        totalDemandKwh:
          $ref: '#/components/schemas/QuantityKwhNonNegative'
        totalPurchasedKwh:
          $ref: '#/components/schemas/QuantityKwhNonNegative'
        totalSoldKwh:
          $ref: '#/components/schemas/QuantityKwhNonNegative'
        reserve:
          $ref: '#/components/schemas/Reserve'
        prices:
          $ref: '#/components/schemas/Prices'
        purchaseCostEur:
          $ref: '#/components/schemas/AmountEur'
        salesRevenueEur:
          $ref: '#/components/schemas/AmountEur'
        marginEur:
          $ref: '#/components/schemas/AmountEur'
          description: salesRevenueEur - purchaseCostEur - reserve.costEur
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/IntervalResult'
          description: 'Nur bei QUARTER_HOUR: Ergebnis je Intervall. Die Felder auf oberster Ebene sind die Tagessummen.'
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
            - UP
            - DOWN
          examples:
          - database: UP
    TradeId:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      examples:
      - 9d2e7a41-0c55-4b8e-9a3f-52c1d8e4f7b6
    EnergyCommunityStatus:
      type: string
      enum:
      - PENDING
      - ACTIVE
      - SUSPENDED
    EnergyCommunityUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
        description:
          type: string
          minLength: 1
          maxLength: 500
      description: Profil bearbeiten. Der Status ist hier nicht erlaubt (nur PUT /energy-communities/{id}/status).
    Me:
      type: object
      required:
      - role
      properties:
        role:
          type: string
          enum:
          - ADMIN
          - ENERGY_COMMUNITY
        energyCommunity:
          $ref: '#/components/schemas/EnergyCommunity'
    EnergyCommunityRegistration:
      type: object
      required:
      - email
      - name
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
        description:
          type: string
          minLength: 1
          maxLength: 500
    LoginRequest:
      type: object
      required:
      - email
      - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    LoginResponse:
      type: object
      required:
      - token
      - tokenType
      - expiresIn
      - role
      properties:
        token:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Gültigkeit in Sekunden
        role:
          type: string
          enum:
          - ADMIN
          - ENERGY_COMMUNITY
        energyCommunity:
          $ref: '#/components/schemas/EnergyCommunity'
    Credentials:
      type: object
      required:
      - apiKey
      - password
      properties:
        apiKey:
          type: string
        password:
          type: string
    MarketResolution:
      type: string
      enum:
      - DAY
      - QUARTER_HOUR
      description: Zeitliche Auflösung des Markts (Vorschlag). DAY = ein Intervall pro Liefertag, QUARTER_HOUR = 15-Minuten-Intervalle.
    IntervalStart:
      type: string
      format: date-time
      pattern: ^\d{4}-\d{2}-\d{2}T\d{2}:(00|15|30|45):00(\.0+)?Z$
      description: Beginn des 15-Minuten-Intervalls in UTC (nur bei QUARTER_HOUR).
      examples:
      - '2026-11-20T11:15:00Z'
    IntervalStartOrNull:
      oneOf:
      - $ref: '#/components/schemas/IntervalStart'
      - type: 'null'
      description: Beginn des Lieferintervalls; null im Tagesmarkt (DAY).
    AllocationReason:
      type: string
      enum:
      - FULLY_ALLOCATED
      - PARTIALLY_ALLOCATED
      - PRICE_NOT_MET
      - NOT_NEEDED
      - RESERVE_SHORTAGE
      description: 'Warum die Zuteilung so ausfällt (Vorschlag). FULLY_ALLOCATED: volle Menge. PARTIALLY_ALLOCATED: Angebot
        pro rata gekürzt, weil handelbare Angebote den Bedarf übersteigen. PRICE_NOT_MET: Preisvorstellung über buyPriceEurPerKwh,
        nicht gehandelt. NOT_NEEDED: kein Bedarf vorhanden. RESERVE_SHORTAGE: Bedarf gekürzt, weil die Reserve nicht reicht.'
    IntervalResult:
      type: object
      required:
      - intervalStart
      - totalOfferedKwh
      - tradableOfferedKwh
      - totalDemandKwh
      - totalPurchasedKwh
      - totalSoldKwh
      - reserve
      properties:
        intervalStart:
          $ref: '#/components/schemas/IntervalStart'
        totalOfferedKwh:
          $ref: '#/components/schemas/QuantityKwhNonNegative'
        tradableOfferedKwh:
          $ref: '#/components/schemas/QuantityKwhNonNegative'
        totalDemandKwh:
          $ref: '#/components/schemas/QuantityKwhNonNegative'
        totalPurchasedKwh:
          $ref: '#/components/schemas/QuantityKwhNonNegative'
        totalSoldKwh:
          $ref: '#/components/schemas/QuantityKwhNonNegative'
        reserve:
          $ref: '#/components/schemas/Reserve'
    EnergyCommunityStatusUpdate:
      type: object
      required:
      - status
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/EnergyCommunityStatus'
  examples:
    VALIDATION_FAILED:
      summary: 400 VALIDATION_FAILED
      value:
        code: VALIDATION_FAILED
        message: At least one field is invalid.
        details:
        - field: /quantityKwh
          code: INVALID_QUANTITY
          message: quantityKwh must be greater than 0.
    INVALID_ID:
      summary: 400 INVALID_ID
      value:
        code: INVALID_ID
        message: The ID is not a valid UUID.
    INVALID_DELIVERY_DATE:
      summary: 400 INVALID_DELIVERY_DATE
      value:
        code: INVALID_DELIVERY_DATE
        message: deliveryDate must be in the format YYYY-MM-DD.
    INVALID_INTERVAL:
      summary: 400 INVALID_INTERVAL
      value:
        code: INVALID_INTERVAL
        message: intervalStart is missing, not allowed or not a quarter hour of the delivery day.
    INVALID_POSITION_TYPE:
      summary: 400 INVALID_POSITION_TYPE
      value:
        code: INVALID_POSITION_TYPE
        message: type must be OFFER or DEMAND.
    INVALID_QUANTITY:
      summary: 400 INVALID_QUANTITY
      value:
        code: INVALID_QUANTITY
        message: quantityKwh must be greater than 0 (max. 3 decimal places).
    INVALID_PRICE:
      summary: 400 INVALID_PRICE
      value:
        code: INVALID_PRICE
        message: The price must be between 0 and 100 EUR/kWh (max. 5 decimal places).
    UNAUTHORIZED:
      summary: 401 UNAUTHORIZED
      value:
        code: UNAUTHORIZED
        message: API key or token is missing, invalid or expired.
    INVALID_CREDENTIALS:
      summary: 401 INVALID_CREDENTIALS
      value:
        code: INVALID_CREDENTIALS
        message: Email or password is wrong.
    FORBIDDEN:
      summary: 403 FORBIDDEN
      value:
        code: FORBIDDEN
        message: You are not allowed to access this resource or perform this action.
    FORBIDDEN_FOREIGN_ENERGY_COMMUNITY:
      summary: 403 FORBIDDEN (fremde energyCommunityId)
      value:
        code: FORBIDDEN
        message: energyCommunityId does not belong to the authenticated energy community.
    ENERGY_COMMUNITY_NOT_ACTIVE:
      summary: 403 ENERGY_COMMUNITY_NOT_ACTIVE
      value:
        code: ENERGY_COMMUNITY_NOT_ACTIVE
        message: The energy community is not active (pending approval or suspended).
    ENERGY_COMMUNITY_NOT_FOUND:
      summary: 404 ENERGY_COMMUNITY_NOT_FOUND
      value:
        code: ENERGY_COMMUNITY_NOT_FOUND
        message: The energy community does not exist.
    POSITION_NOT_FOUND:
      summary: 404 POSITION_NOT_FOUND
      value:
        code: POSITION_NOT_FOUND
        message: The position does not exist.
    MARKET_NOT_FOUND:
      summary: 404 MARKET_NOT_FOUND
      value:
        code: MARKET_NOT_FOUND
        message: No market exists for the delivery date.
    EMAIL_ALREADY_REGISTERED:
      summary: 409 EMAIL_ALREADY_REGISTERED
      value:
        code: EMAIL_ALREADY_REGISTERED
        message: An energy community with this email is already registered.
    ENERGY_COMMUNITY_IN_USE:
      summary: 409 ENERGY_COMMUNITY_IN_USE
      value:
        code: ENERGY_COMMUNITY_IN_USE
        message: The energy community cannot be deleted because it has positions or trades.
    INVALID_STATUS_TRANSITION:
      summary: 409 INVALID_STATUS_TRANSITION
      value:
        code: INVALID_STATUS_TRANSITION
        message: This status change is not allowed.
    POSITION_ALREADY_EXISTS:
      summary: 409 POSITION_ALREADY_EXISTS
      value:
        code: POSITION_ALREADY_EXISTS
        message: A position already exists for this energy community, delivery date and interval.
    POSITION_NOT_MODIFIABLE:
      summary: 409 POSITION_NOT_MODIFIABLE
      value:
        code: POSITION_NOT_MODIFIABLE
        message: The position is cancelled or already processed and can no longer be changed.
    MARKET_CLOSED:
      summary: 409 MARKET_CLOSED
      value:
        code: MARKET_CLOSED
        message: The market is already closed.
    MARKET_NOT_SETTLED:
      summary: 409 MARKET_NOT_SETTLED
      value:
        code: MARKET_NOT_SETTLED
        message: The market result is not available yet.
    DELIVERY_DATE_IN_PAST:
      summary: 422 DELIVERY_DATE_IN_PAST
      value:
        code: DELIVERY_DATE_IN_PAST
        message: The delivery date is in the past.
    INTERNAL_ERROR:
      summary: 500 INTERNAL_ERROR
      value:
        code: INTERNAL_ERROR
        message: Internal error.
