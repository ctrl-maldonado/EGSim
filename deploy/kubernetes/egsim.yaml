# EGSim im Kubernetes-Cluster neben der Plattform.
#   kubectl create secret generic egsim --from-literal=ui-password='<langes Passwort>' -n <namespace>
#   kubectl apply -f deploy/kubernetes/egsim.yaml -n <namespace>
# Image: wird per GitHub Actions nach ghcr.io/renshredder/egsim gebaut (bei privatem Paket imagePullSecret ergänzen).
# In der UI als Basis-URL den Service der Plattform eintragen, z. B. http://handelsplattform:8080
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: egsim-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egsim
  labels: {app: egsim}
spec:
  replicas: 1                # Konfiguration liegt in einer Datei → genau eine Instanz
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: egsim}
  template:
    metadata:
      labels: {app: egsim}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: egsim
          image: ghcr.io/renshredder/egsim:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: EGSIM_UI_PASSWORD
              valueFrom:
                secretKeyRef: {name: egsim, key: ui-password}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: egsim-data
---
apiVersion: v1
kind: Service
metadata:
  name: egsim
spec:
  selector: {app: egsim}
  ports:
    - port: 8090
      targetPort: http
      name: http
# Zugriff ohne Ingress: kubectl port-forward svc/egsim 8090:8090
