[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egsim"
version = "0.1.0"
description = "Konfigurierbare Dummy-Energiegemeinschaften zum Testen der Handelsplattform-API (Datenvertrag 0.2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
egsim = "egsim.cli:main"

[tool.setuptools.packages.find]
include = ["egsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
